# Konfigurasi utama eksperimen.
# Kode TIDAK boleh menyimpan parameter sendiri; semua dibaca dari sini.

paths:            
  manifest: data/manifest
  raw: data/raw
  processed: data/processed
  outputs: data/outputs
  results: results
  prompts: prompts

dataset:
  films_csv: films.csv              
  annotations_csv: gt_annotations.csv
  gt_mode: raw                      # raw = semua GT; curated = hanya include == yes
  min_gt_per_film: 3      # film dengan GT lolos kurasi < ini dikeluarkan
  
scraping:
  user_agent: "plothole-eval/0.1 (riset tugas akhir)"
  delay_seconds: 2          # jeda antar-request
  timeout_seconds: 30
  max_retries: 3
  wayback_target: "20240101"   # cari snapshot terdekat ke tanggal ini

preprocessing:
  tokenizer: o200k_base            # tokenizer referensi untuk estimasi
  restore_lines_if_avg_line_over: 500   
  restore_lines_space_gap: 4       
  min_scene_headings: 30         
  block_target_tokens: 600         
  acts: [0.25, 0.50, 0.25]         

experiment:
  name: main_grid
  strategies: [zero_shot, cot, chunking]
  repeats: 1
  temperature: 0.0
  seed: 42

models: []                          