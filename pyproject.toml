[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plothole"
version = "0.1.0"
description = "Framework evaluasi LLM untuk deteksi plot hole pada naskah film"
authors = [{ name = "Debby Lelyca Rohdearni Damanik" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tiktoken>=0.7",
    "streamlit>=1.35",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]